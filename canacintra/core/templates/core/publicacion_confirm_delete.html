{% extends "base.html" %}
{% block title %}Eliminar publicación{% endblock %}
{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'core:index' %}">Inicio</a></li>
    <li class="breadcrumb-item"><a href="{% url 'core:posts' %}">Publicaciones</a></li>
    <li class="breadcrumb-item active" aria-current="page">Eliminar</li>
  </ol>
</nav>
<h1 class="mb-4">Eliminar publicación</h1>
<p>¿Seguro que deseas eliminar "{{ object.titulo }}"?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Sí, eliminar</button>
  <a href="{% url 'core:posts' %}" class="btn btn-secondary ms-2">Cancelar</a>
</form>
{% endblock %}
