{% include "partials/header.html" %}

<main id="main">
  <div class="container">
    {% if messages %}
      <div class="mt-3">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}
    <!-- Aquí va el contenido de cada vista -->
    {% endblock %}
  </div>
</main>
